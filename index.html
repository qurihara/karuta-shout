<!doctype html>
<html lang="ja">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>叫ぶ！百人一首 Karuta Shout</title>

<style>
body{
  font-family:system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans JP",sans-serif;
  max-width:980px;margin:16px auto;padding:0 12px
}
h1{font-size:22px}
h2{font-size:18px;margin:0 0 6px}
.card{border:1px solid #ddd;border-radius:12px;padding:12px;margin:12px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button,input,select{font-size:16px;padding:8px 10px}
.choiceBtn{font-size:18px;font-weight:700;border-radius:10px}
.big{font-size:20px;font-weight:700}
.muted{opacity:.7}
#log{
  white-space:pre-wrap;background:#fafafa;border:1px solid #eee;border-radius:10px;
  padding:10px;min-height:150px;max-height:320px;overflow:auto
}
.ok{color:#0a7}
.ng{color:#c33}
</style>

<!-- PeerJS (public PeerServer Cloud) -->
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<!-- QR code -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<!-- kuromoji.js -->
<script src="https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/build/kuromoji.js"></script>
</head>

<body>
<h1>叫ぶ百人一首 Karuta Shout（P2P / iPhone混在）v0.16</h1>

<div class="card" id="modeCard"></div>

<div class="card">
  <div class="row">
    <div><b>状態:</b> <span id="status">-</span></div>
    <div><b>ID:</b> <code id="selfId">-</code></div>
    <div id="peerCountWrapper"><b>参加者:</b> <span id="peerCount">0</span></div>
  </div>
</div>

<!-- HOST UI -->
<div class="card" id="hostUI" style="display:none">
  <h2>親機（出題者）</h2>

  <div class="row">
    <button id="startGame" disabled>ゲーム開始</button>
    <button id="nextRound" disabled style="display:none">次の問題</button>
  </div>
  <div class="row" style="margin-top:8px;">
    <input type="checkbox" id="bgmMode" name="bgmMode">
    <label for="bgmMode">作業BGMモード（次の歌まで0秒～10分）</label>
  </div>
  <div class="row" style="margin-top:8px;align-items:center;">
    <label for="questionCount" style="white-space:nowrap;">問題数:</label>
    <input type="range" id="questionCount" min="1" max="100" value="100" style="flex:1">
    <span id="questionCountValue" style="width:3em;text-align:right;font-weight:bold;">100</span>
  </div>
  <div class="row" style="margin-top:6px">
    <div>問題: <span id="questionNum">-</span> / 100 (歌ID: <span id="cardIdSpan">-</span>)</div>
    <div>現在の状態: <b id="roundStatus">待機中</b></div>
  </div>
  <div style="margin-top:6px">出題(上の句): <span id="currentQuestionKimariji">-</span></div>
  <div style="margin-top:6px">正解(下の句): <span id="currentAnswer">-</span></div>


  <div style="margin-top:10px">
    <div class="big">スコアボード</div>
    <div id="scoreboard"></div>
  </div>

  <div style="margin-top:10px">
    <div class="big">参加用QR</div>
    <div id="qrcode"></div>
    <div style="margin-top:6px">
      <a id="joinLink" href="#" target="_blank" style="word-break:break-all"></a>
    </div>
  </div>

  <div style="margin-top:10px">
    <div class="big">結果</div>
    <div id="result">-</div>
  </div>
</div>

<!-- PLAYER UI -->
<div class="card" id="playerUI" style="display:none">
  <h2>子機（回答者）</h2>
  <div id="compatMsg" class="muted"></div>

  <div id="answerBlock" style="margin-top:8px">
    <div class="row">
      <input id="textInput" placeholder="回答を入力してEnter" style="flex:1" disabled>
      <button id="speak" disabled>音声で回答</button>
    </div>
    <div class="muted">PC/Androidは音声認識、iPhoneはテキスト入力が推奨です。</div>
    <div>送信: <span id="lastSent">-</span></div>
  </div>
  <button id="micPerm" style="display:none">マイク許可</button>
</div>

<div class="card">
  <h2>ログ</h2>
  <div id="log"></div>
</div>


<script>
(() => {
  let kamiKimarijiList = [];
  let kimarijiList = [];
  // ★★★ gooラボのひらがな化APIを使用するために、ご自身のAPP IDを設定してください ★★★
  const GOO_APP_ID = "YOUR_GOO_LAB_APP_ID"; 

  const $ = id => document.getElementById(id);

  const log = (s) => {
    const el = $("log");
    el.textContent += s + "\n";
    el.scrollTop = el.scrollHeight;
  };

  const params = new URLSearchParams(location.search);
  const role = (params.get("role") || "host").toLowerCase();
  const hostId = params.get("host");

  $("modeCard").innerHTML = `<b>モード:</b> ${role}`;
  log(`[init] role=${role} hostId=${hostId || "-"}`);

  function shortId(s){ return String(s||"").slice(0,8); }

  function normalizeChoice(text){
    if(!text) return null;
    let t = String(text).replace(/\s+/g,"").replace(/[、。．，]/g,"");
    t = t.replace(/[\u30a1-\u30f6]/g, (match) => {
      const chr = match.charCodeAt(0) - 0x60;
      return String.fromCharCode(chr);
    });
    const sortedKimariji = kimarijiList.slice(1).sort((a, b) => b.length - a.length);
    return sortedKimariji.find(k => t.startsWith(k)) || null;
  }

  const peer = new Peer();
  const conns = new Map();

  // --- 親機側の状態管理 ---
  let tokenizer = null;
  let gameInProgress = false;
  let questionIds = [];
  let currentQuestionIndex = -1;
  let roundOpen = false;
  let currentCardId = null;
  let key = null;
  let winner = null;
  const scores = new Map();
  const answerQueue = [];
  let isProcessingQueue = false;
  let currentAudio = null;
  let totalQuestions = 100;

  function broadcast(obj){
    conns.forEach(c => { if(c.open) c.send(obj); });
  }

  function updateScoreboard(){
    let html = "";
    scores.forEach((score, peerId) => {
      html += `<div>${shortId(peerId)}: ${score}点</div>`;
    });
    $("scoreboard").innerHTML = html;
  }

  function convertToHiragana(text) {
    if (!tokenizer) {
      log("[host] Tokenizer not ready.");
      return text;
    }
    const tokens = tokenizer.tokenize(text);
    return tokens.map(token => token.reading ? token.reading.replace(/[\u30a1-\u30f6]/g, m => String.fromCharCode(m.charCodeAt(0) - 0x60)) : token.surface_form).join('');
  }

  async function processAnswerQueue() {
    if (isProcessingQueue || answerQueue.length === 0) return;
    if (winner) {
      answerQueue.length = 0;
      return;
    }

    isProcessingQueue = true;
    const { raw, peerId } = answerQueue.shift();

    try {
      const hiraganaText = convertToHiragana(raw);
      log(`[host] Converted "${raw}" to "${hiraganaText}"`);
      const norm = normalizeChoice(hiraganaText);
      const ok = (norm === key);

      if (ok) {
        new Audio('./se/Quiz-Ding_Dong02-2(Fast-Single).mp3').play();
        winner = peerId;
        roundOpen = false;
        scores.set(peerId, (scores.get(peerId) || 0) + 1);
        updateScoreboard();
        $("result").innerHTML = `<span class="ok">勝者:</span> ${shortId(peerId)} / 回答: ${norm}`;
        $("roundStatus").textContent = "正解！";
        log(`[host] Winner is ${shortId(peerId)}`);

        if (currentAudio) currentAudio.pause();
        const audioB = new Audio(`./sounds/I-${String(currentCardId).padStart(3, '0')}B.mp3`);
        currentAudio = audioB;
        
        broadcast({ type: "roundResult", winner, norm, raw, correct: true, key });

        audioB.onended = scheduleNextRound; // 次のラウンドをスケジュール

        $("nextRound").disabled = true; // 自動進行中は手動操作不要
        audioB.play();
      } else {
        new Audio('./se/Quiz-Buzzer05-2(Short).mp3').play();
        log(`[host] Incorrect answer from ${shortId(peerId)}: "${raw}"`);
      }
    } catch (error) {
      log(`[host] Error processing answer: ${error}`);
    } finally {
      isProcessingQueue = false;
      if (answerQueue.length > 0) processAnswerQueue();
    }
  }

  function scheduleNextRound() {
    const isBgmMode = $("bgmMode").checked;
    let delay = 2000; // デフォルトは2秒

    if (isBgmMode) {
      // 0秒から10分 (600,000ミリ秒) までのランダムな時間
      delay = Math.random() * 600 * 1000;
      log(`[host] BGM mode enabled. Next round in ${Math.round(delay / 1000)} seconds.`);
    } else {
      log(`[host] Next round in 2 seconds.`);
    }

    if (currentQuestionIndex >= questionIds.length - 1) {
      setTimeout(showFinalResult, delay); // 最後の問題の後も遅延を入れる
      log('[host] No more questions.');
    } else {
      $("roundStatus").textContent = "次の問題へ...";
      $("nextRound").disabled = true;
      setTimeout(startNewRound, delay);
    }
  }

  function showFinalResult() {
    let finalResult = "<h2>ゲーム終了！</h2>";
    let maxScore = -1;
    let champions = [];
    scores.forEach((score, pId) => {
      finalResult += `<div>${shortId(pId)}: ${score}点</div>`;
      if (score > maxScore) {
        maxScore = score;
        champions = [pId];
      } else if (score === maxScore) {
        champions.push(pId);
      }
    });
    if (maxScore > 0) {
      finalResult += `<div class="big" style="margin-top:10px">優勝: ${champions.map(shortId).join(', ')}</div>`;
    } else {
      finalResult += `<div class="big" style="margin-top:10px">勝者なし</div>`;
    }
    $("result").innerHTML = finalResult;
    $("roundStatus").textContent = "ゲーム終了";
    $("nextRound").style.display = "none";
    $("startGame").style.display = "inline-block";
    $("questionCount").disabled = false;
    gameInProgress = false;
  }

  // --- 子機側の状態管理 ---
  function setAnswerEnabled(enabled){
    $("textInput").disabled = !enabled;
    $("speak").disabled = !enabled;
  }

  peer.on("open", id => {
    $("selfId").textContent = id.slice(0,12);
    $("status").textContent = "接続OK";
    log(`[peer] open id=${id}`);

    if(role==="host"){
      // --- 親機の初期化 ---
      $("hostUI").style.display="block";

      const questionCountSlider = $("questionCount");
      const questionCountValue = $("questionCountValue");
      questionCountSlider.oninput = () => {
        questionCountValue.textContent = questionCountSlider.value;
      };
      const statusEl = $("roundStatus");
      statusEl.textContent = "データ準備中...";
      log("[host] Initializing data...");

      const loadKimariji = fetch('./小倉百人一首.csv')
        .then(r => {
          if (!r.ok) throw new Error(`CSV not found: ${r.status}`);
          return r.text();
        })
        .then(csv => {
          const lines = csv.trim().split('\n').slice(1);
          kamiKimarijiList = ["", ...lines.map(l => l.split(',')[1] || "")];
          kimarijiList = ["", ...lines.map(l => l.split(',')[2] || "")];
          log('[host] Kimariji list loaded.');
        });

      const loadTokenizer = new Promise((resolve, reject) => {
        kuromoji.builder({ dicPath: "./dict/" }).build((err, _tokenizer) => {
          if (err) return reject(err);
          tokenizer = _tokenizer;
          log("[host] Tokenizer ready.");
          resolve();
        });
      });

      Promise.all([loadKimariji, loadTokenizer]).then(() => {
        statusEl.textContent = "待機中";
        $("startGame").disabled = false;
      }).catch(err => {
        log("[host] Initialization failed: " + err);
        statusEl.textContent = "初期化エラー";
        alert("データの初期化に失敗しました: " + err);
      });

      const url = new URL(location.href);
      url.searchParams.set("role","player");
      url.searchParams.set("host",id);
      $("joinLink").href = url.toString();
      $("joinLink").textContent = url.toString();
      $("qrcode").innerHTML = "";
      new QRCode($("qrcode"),{text:url.toString(),width:200,height:200});
      log(`[host] join url = ${url.toString()}`);

      peer.on("connection", c=>{
        conns.set(c.peer,c);
        scores.set(c.peer, 0);
        $("peerCount").textContent = conns.size;
        updateScoreboard();
        log(`[host] connected: peer=${c.peer}`);

        c.on("close", () => {
          conns.delete(c.peer);
          scores.delete(c.peer);
          $("peerCount").textContent = conns.size;
          updateScoreboard();
          log(`[host] disconnected: peer=${c.peer}`);
        });

        c.on("data", msg=>{
          if (msg && msg.type === "answer") {
            if (!roundOpen) return;
            answerQueue.push({ raw: msg.raw, peerId: c.peer });
            processAnswerQueue();
          }
        });
      });

    } else {
      // --- 子機の初期化 ---
      $("playerUI").style.display="block";
      $("peerCountWrapper").style.display = "none";
      if (!hostId) {
        alert("hostパラメータがありません。親機のQRから開いてください。");
        return;
      }

      $("status").textContent="決まり字データ読込中...";
      fetch('./小倉百人一首.csv')
        .then(r => {
          if (!r.ok) throw new Error(`CSV not found: ${r.status}`);
          return r.text();
        })
        .then(csv => {
          const lines = csv.trim().split('\n').slice(1);
          kimarijiList = ["", ...lines.map(l => l.split(',')[2] || "")];
          log('[player] Kimariji list loaded.');

          let recognition = null;
          let recognitionActive = false;

          const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
          if (SR) {
            recognition = new SR();
            recognition.lang = "ja-JP";
            recognition.continuous = false; // 一つの発話で停止
            recognition.interimResults = false;

            // SpeechGrammarListがサポートされているブラウザでのみ文法を設定
            if (window.SpeechGrammarList || window.webkitSpeechGrammarList) {
              const grammar = '#JSGF V1.0; grammar choices; public <choice> = ' + kimarijiList.slice(1).filter(Boolean).join(' | ') + ' ;';
              const speechRecognitionList = new (window.SpeechGrammarList || window.webkitSpeechGrammarList)();
              speechRecognitionList.addFromString(grammar, 1);
              recognition.grammars = speechRecognitionList;
              log('[player] Speech grammar set.');
            } else {
              log('[player] Speech grammar not supported on this browser.');
            }

            recognition.onresult = e => {
              const raw = e.results?.[e.results.length - 1]?.[0]?.transcript ?? "";
              if (raw) {
                log(`[player] STT result raw="${raw}"`);
                send(raw);
              }
            };
            recognition.onerror = e => {
              log(`[player] STT error: ${e.error || "unknown"}`);
            };
            recognition.onend = () => {
              log("[player] STT end");
              if (recognitionActive) {
                log("[player] STT restarting...");
                try { recognition.start(); } catch(e) { /* 既に開始されている場合のエラーは無視 */ }
              }
            };
            
            $("micPerm").style.display = "inline-block";
            $("speak").onclick = () => {
              if (recognition && !recognitionActive) {
                recognitionActive = true;
                try { recognition.start(); } catch(e) { log('[player] recognition.start failed: ' + e); }
              }
            };
            $("micPerm").onclick = async () => {
              try {
                await navigator.mediaDevices.getUserMedia({audio:true});
                log("[player] mic permission OK");
                $("micPerm").style.display = "none";
              } catch (e) {
                alert("マイク許可が必要です: " + e);
              }
            };
          } else {
            $("speak").style.display = "none";
          }

          $("status").textContent="親機へ接続中...";
          const c = peer.connect(hostId);

          c.on("open",()=> {
            $("status").textContent="親機接続OK";
            log(`[player] connected to host=${hostId}`);
          });
          c.on("close",()=> {
            $("status").textContent="切断";
            setAnswerEnabled(false);
            recognitionActive = false;
            if (recognition) recognition.stop();
          });
          c.on("data", msg=>{
            log(`[player] recv ${JSON.stringify(msg)}`);
            if(msg && msg.type==="round"){
              setAnswerEnabled(true);
              $("textInput").focus();
              if (recognition) {
                recognitionActive = true;
                try { recognition.start(); } catch(e) { log('[player] recognition.start failed: ' + e); }
              }
            }
            if(msg && msg.type==="roundResult"){
              setAnswerEnabled(false);
              recognitionActive = false;
              if (recognition) recognition.stop();
            }
          });

          function send(raw){
            if(!c || !c.open) return;
            c.send({type:"answer", raw});
            $("lastSent").textContent = raw;
            $("textInput").value = "";
          }

          $("textInput").onkeydown = (e) => {
            if (e.key === "Enter") {
              e.preventDefault();
              send(e.target.value);
            }
          };
          
          setAnswerEnabled(false);
        })
        .catch(err => {
          log("[player] Initialization failed: " + err);
          $("status").textContent = "初期化エラー";
          alert("データの初期化に失敗しました: " + err);
        });
    }
  });

  peer.on("error", (err) => {
    $("status").textContent = "エラー";
    log("[peer] error: " + (err?.type || "") + " " + (err?.message || String(err)));
  });

  // --- 親機のボタン処理 ---
  $("startGame").onclick=()=>{
    if (role !== "host" || gameInProgress) return;
    gameInProgress = true;
    totalQuestions = parseInt($("questionCount").value, 10);
    $("questionCount").disabled = true;

    let allIds = Array.from({length: 100}, (_, i) => i + 1);
    for (let i = allIds.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [allIds[i], allIds[j]] = [allIds[j], allIds[i]];
    }
    questionIds = allIds.slice(0, totalQuestions);
    log(`[host] Game started with ${totalQuestions} questions.`);
    currentQuestionIndex = -1;
    scores.forEach((_, key) => scores.set(key, 0));
    updateScoreboard();

    $("startGame").style.display = "none";
    $("nextRound").style.display = "inline-block";
    $("nextRound").disabled = false;
    
    startNewRound();
  };

  function startNewRound(){
    if (role !== "host") return;
    currentQuestionIndex++;
    currentCardId = questionIds[currentQuestionIndex];
    key = kimarijiList[currentCardId];
    const kamiKimariji = kamiKimarijiList[currentCardId];

    $("questionNum").textContent = `${currentQuestionIndex + 1} / ${totalQuestions}`;
    $("cardIdSpan").textContent = currentCardId;
    $("currentQuestionKimariji").textContent = kamiKimariji;
    $("currentAnswer").textContent = key;
    $("result").textContent="-";
    $("nextRound").disabled = true;
    $("roundStatus").textContent = "出題準備中...";
    winner = null;
    answerQueue.length = 0;

    log(`[host] ROUND ${currentQuestionIndex + 1} START (ID: ${currentCardId}, Key: ${key})`);

    setTimeout(() => {
      roundOpen = true;
      if (currentAudio) {
        currentAudio.pause();
      }
      const audioA = new Audio(`./sounds/I-${String(currentCardId).padStart(3,'0')}A.mp3`);
      currentAudio = audioA;
      audioA.play();
      broadcast({type:"round"});
      $("roundStatus").textContent = "回答受付中";
      log("[host] audio played, round opened");
      $("nextRound").disabled = false;
    }, 2000);
  }

  $("nextRound").onclick = () => {
    if (role !== "host" || !gameInProgress) return;

    // 進行中のラウンドを中断
    if (currentAudio) {
      currentAudio.pause();
      currentAudio = null;
    }
    if (roundOpen) {
      roundOpen = false;
      broadcast({type:"roundResult"});
      log(`[host] Skipping question ${currentCardId}`);
    }
    
    // 次のラウンドをスケジュール
    scheduleNextRound();
  };
})();
</script>
</script>
</body>
</html>
