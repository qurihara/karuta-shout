<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>P2P 百人一首 早押し音声クイズ</title>

<style>
body{
  font-family:system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans JP",sans-serif;
  max-width:980px;margin:16px auto;padding:0 12px
}
h1{font-size:22px}
h2{font-size:18px;margin:0 0 6px}
.card{border:1px solid #ddd;border-radius:12px;padding:12px;margin:12px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button,input,select{font-size:16px;padding:8px 10px}
.choiceBtn{font-size:18px;font-weight:700;border-radius:10px}
.big{font-size:20px;font-weight:700}
.muted{opacity:.7}
#log{
  white-space:pre-wrap;background:#fafafa;border:1px solid #eee;border-radius:10px;
  padding:10px;min-height:150px;max-height:320px;overflow:auto
}
.ok{color:#0a7}
.ng{color:#c33}
</style>

<!-- PeerJS (public PeerServer Cloud) -->
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<!-- QR code -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<body>
<h1>百人一首 早押し音声クイズ（P2P / iPhone混在）</h1>

<div class="card" id="modeCard"></div>

<div class="card">
  <div class="row">
    <div><b>状態:</b> <span id="status">-</span></div>
    <div><b>ID:</b> <code id="selfId">-</code></div>
    <div><b>参加者:</b> <span id="peerCount">0</span></div>
  </div>
</div>

<!-- HOST UI -->
<div class="card" id="hostUI" style="display:none">
  <h2>親機（出題者）</h2>

  <div class="row">
    <label>正解：
      <select id="answerKey">
        <option value="わがい">わがい</option>
        <option value="わがそ">わがそ</option>
        <option value="わすら">わすら</option>
        <option value="わすれ">わすれ</option>
        <option value="わたのはらこ">わたのはらこ</option>
        <option value="わたのはらや">わたのはらや</option>
        <option value="わび">わび</option>
      </select>
    </label>

    <button id="startRound" disabled>ラウンド開始</button>
    <button id="resetRound" disabled>リセット</button>
  </div>

  <div class="row" style="margin-top:6px">
    <label>判定方式：
      <select id="judgeMode">
        <option value="firstMessage">先着（最初に届いた回答）</option>
        <option value="firstCorrect" selected>最初の正解者</option>
      </select>
    </label>
  </div>

  <div style="margin-top:10px">
    <div class="big">参加用QR</div>
    <div id="qrcode"></div>
    <div style="margin-top:6px">
      <a id="joinLink" href="#" target="_blank" style="word-break:break-all"></a>
    </div>
  </div>

  <div style="margin-top:10px">
    <div class="big">結果</div>
    <div id="result">-</div>
  </div>
</div>

<!-- PLAYER UI -->
<div class="card" id="playerUI" style="display:none">
  <h2>子機（回答者）</h2>
  <div id="compatMsg" class="muted"></div>

  <!-- SpeechRecognition -->
  <div id="srBlock" style="display:none;margin-top:8px">
    <div class="row">
      <button id="micPerm">マイク許可</button>
      <button id="speak" disabled>「わ」で始まる句を言う</button>
    </div>
    <div class="muted">Android / PC Chrome向け</div>
    <div>送信: <span id="lastSent">-</span></div>
  </div>

  <!-- iOS dictation -->
  <div id="iosBlock" style="display:none;margin-top:8px">
    <div class="muted">iPhone: 入力欄→🎤で音声入力</div>
    <div class="row">
      <input id="dictInput" placeholder="例：わたのはらや" style="flex:1">
      <button id="sendDict" disabled>送信</button>
    </div>
    <div>送信: <span id="lastSent2">-</span></div>
  </div>

  <!-- fallback buttons -->
  <div style="margin-top:10px">
    <div class="row">
      <button class="choiceBtn" data-choice="わがい" disabled>わがい</button>
      <button class="choiceBtn" data-choice="わがそ" disabled>わがそ</button>
      <button class="choiceBtn" data-choice="わすら" disabled>わすら</button>
      <button class="choiceBtn" data-choice="わすれ" disabled>わすれ</button>
      <button class="choiceBtn" data-choice="わたのはらこ" disabled>わたのはらこ</button>
      <button class="choiceBtn" data-choice="わたのはらや" disabled>わたのはらや</button>
      <button class="choiceBtn" data-choice="わび" disabled>わび</button>
    </div>
  </div>
</div>

<div class="card">
  <h2>ログ</h2>
  <div id="log"></div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);

  // ログ：スクロールしつつ確実に表示
  const log = (s) => {
    const el = $("log");
    el.textContent += s + "\n";
    el.scrollTop = el.scrollHeight;
  };

  const params = new URLSearchParams(location.search);
  const role = (params.get("role") || "host").toLowerCase();
  const hostId = params.get("host");

  $("modeCard").innerHTML = `<b>モード:</b> ${role}`;
  log(`[init] role=${role} hostId=${hostId || "-"}`);

  // ★ 追加：勝者表示用の短縮ID
  function shortId(s){ return String(s||"").slice(0,8); }

  function normalizeChoice(text){
    if(!text) return null;
    const t = String(text).replace(/\s+/g,"").replace(/[、。．，]/g,"");
    const list = [
      "わがい","わがそ","わすら","わすれ",
      "わたのはらこ","わたのはらや","わび"
    ];
    return list.find(k => t.startsWith(k)) || null;
  }

  const peer = new Peer();
  const conns = new Map();

  // クイズ状態（host側で使用）
  let roundOpen = false;
  let key = null;
  let winner = null;

  function broadcast(obj){
    conns.forEach(c => { if(c.open) c.send(obj); });
  }

  // 子機：回答UIだけ enable/disable（他のボタンまで殺さない）
  function setAnswerEnabled(enabled){
    const ids = ["speak","sendDict","dictInput"];
    ids.forEach(id => {
      const el = document.getElementById(id);
      if (el) el.disabled = !enabled;
    });
    document.querySelectorAll(".choiceBtn").forEach(btn => btn.disabled = !enabled);
  }

  peer.on("open", id => {
    $("selfId").textContent = id.slice(0,12);
    $("status").textContent = "接続OK";
    log(`[peer] open id=${id}`);

    if(role==="host"){
      $("hostUI").style.display="block";
      $("startRound").disabled=false;
      $("resetRound").disabled=false;

      const url = new URL(location.href);
      url.searchParams.set("role","player");
      url.searchParams.set("host",id);

      $("joinLink").href = url.toString();
      $("joinLink").textContent = url.toString();

      // QRを再生成（念のためクリア）
      $("qrcode").innerHTML = "";
      new QRCode($("qrcode"),{text:url.toString(),width:200,height:200});

      log(`[host] join url = ${url.toString()}`);

      peer.on("connection", c=>{
        conns.set(c.peer,c);
        $("peerCount").textContent = conns.size;
        log(`[host] connected: peer=${c.peer}`);

        c.on("close", () => {
          conns.delete(c.peer);
          $("peerCount").textContent = conns.size;
          log(`[host] disconnected: peer=${c.peer}`);
        });

        c.on("data", msg=>{
          // 受信ログを必ず出す（デバッグ用）
          try {
            log(`[host] recv from=${String(c.peer).slice(0,12)} ${JSON.stringify(msg)}`);
          } catch {
            log(`[host] recv from=${String(c.peer).slice(0,12)} (non-json)`);
          }

          if(msg && msg.type==="answer"){
            if(!roundOpen) {
              log(`[host] ignore answer (round closed)`);
              return;
            }

            const raw = msg.raw ?? "";
            const norm = msg.norm ?? normalizeChoice(raw);
            const ok = (norm === key);

            // 判定方式
            const judgeMode = $("judgeMode").value;

            if (judgeMode === "firstMessage") {
              if (winner) return; // 最初に届いた回答でロック
              winner = c.peer;

              // ★ 変更：勝者は送信者IDを表示し、回答は併記
              $("result").innerHTML =
                `<span class="ok">勝者:</span> ${shortId(c.peer)} / ` +
                `回答: ${norm ?? "（不一致）"} / raw=${raw} / 正解=${key}`;

              roundOpen = false;
              broadcast({type:"roundResult", winner, norm, raw, correct: ok, key});
              return;
            }

            // firstCorrect（デフォルト）
            if (judgeMode === "firstCorrect") {
              if (!ok) {
                log(`[host] not correct: norm=${norm ?? "(no match)"} key=${key}`);
                return;
              }
              if (winner) return;
              winner = c.peer;

              // ★ 変更：勝者は送信者IDを表示し、回答は併記
              $("result").innerHTML =
                `<span class="ok">勝者:</span> ${shortId(c.peer)} / ` +
                `回答: ${norm} / raw=${raw}`;

              roundOpen = false;
              broadcast({type:"roundResult", winner, norm, raw, correct: true, key});
              return;
            }
          }
        });
      });

    } else {
      // player
      $("playerUI").style.display="block";

      if (!hostId) {
        $("status").textContent = "エラー";
        log("[player] missing host id (open from QR)");
        alert("hostパラメータがありません。親機のQRから開いてください。");
        return;
      }

      $("status").textContent="親機へ接続中...";
      const c = peer.connect(hostId);

      c.on("open",()=>{
        $("status").textContent="親機接続OK";
        log(`[player] connected to host=${hostId}`);
      });

      c.on("close",()=>{
        $("status").textContent="切断";
        log("[player] disconnected");
        setAnswerEnabled(false);
      });

      c.on("data", msg=>{
        try {
          log(`[player] recv ${JSON.stringify(msg)}`);
        } catch {
          log(`[player] recv (non-json)`);
        }

        if(msg && msg.type==="round"){
          setAnswerEnabled(true);
          log("[player] round start: answering enabled");
        }
        if(msg && msg.type==="roundResult"){
          setAnswerEnabled(false);
          log("[player] round end: answering disabled");
        }
      });

      // 送信：raw と norm を必ずログ＆送信（マッチしなくても）
      function send(raw){
        const norm = normalizeChoice(raw);
        log(`[player] send raw="${raw}" norm=${norm ?? "(no match)"}`);
        c.send({type:"answer", raw, norm});
        // UIにも表示
        if ($("lastSent")) $("lastSent").textContent = `${raw} → ${norm ?? "×"}`;
        if ($("lastSent2")) $("lastSent2").textContent = `${raw} → ${norm ?? "×"}`;
      }

      const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
      const isiPhone = /iPhone|iPad|iPod/.test(navigator.userAgent);

      $("compatMsg").textContent =
        isiPhone ? "iPhone: 🎤音声入力（キーボード） or ボタン" :
        (SR ? "音声認識対応（SpeechRecognitionあり）" : "音声認識非対応：入力 or ボタン");

      $("srBlock").style.display = (!isiPhone && SR) ? "block" : "none";
      $("iosBlock").style.display = (isiPhone || !SR) ? "block" : "none";

      // iOS dictation
      $("sendDict").onclick = () => {
        const v = $("dictInput").value || "";
        send(v);
      };

      // SpeechRecognition（開始/終了/エラーもログ）
      $("micPerm").onclick = async () => {
        try {
          await navigator.mediaDevices.getUserMedia({audio:true});
          log("[player] mic permission OK");
        } catch (e) {
          log("[player] mic permission ERROR: " + e);
          alert("マイク許可が必要です: " + e);
        }
      };

      $("speak").onclick = ()=>{
        if(!SR){
          log("[player] SpeechRecognition not supported");
          return;
        }
        const r = new SR();
        r.lang="ja-JP";

        log("[player] STT start...");
        r.onresult = e => {
          const raw = e.results?.[0]?.[0]?.transcript ?? "";
          log(`[player] STT result raw="${raw}"`);
          send(raw);
        };
        r.onerror = e => {
          log(`[player] STT error: ${e.error || "unknown"}`);
        };
        r.onend = () => {
          log("[player] STT end");
        };

        try { r.start(); }
        catch (err) { log("[player] STT start exception: " + err); }
      };

      // fallback buttons
      document.querySelectorAll(".choiceBtn").forEach(b=>{
        b.onclick = () => send(b.dataset.choice);
      });

      // 初期は回答無効
      setAnswerEnabled(false);
    }
  });

  peer.on("error", (err) => {
    $("status").textContent = "エラー";
    log("[peer] error: " + (err && err.type ? err.type : "") + " " + (err && err.message ? err.message : String(err)));
  });

  // host buttons
  $("startRound").onclick=()=>{
    if (role !== "host") return;

    roundOpen = true;
    winner = null;
    key = $("answerKey").value;

    $("result").textContent="-";
    log(`[host] ROUND START key=${key}`);
    broadcast({type:"round"});
  };

  $("resetRound").onclick=()=>{
    if (role !== "host") return;

    roundOpen = false;
    winner = null;
    $("result").textContent="-";
    log("[host] RESET");
    broadcast({type:"roundResult"}); // 停止通知（簡略）
  };
})();
</script>
</body>
</html>
