<html lang="ja">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>叫ぶ！百人一首 Karuta Shout</title>
<link rel="icon" href="favicon.ico">

<style>
body{
  font-family:system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans JP",sans-serif;
  max-width:980px;margin:16px auto;padding:0 12px
}
h1{font-size:22px}
h2{font-size:18px;margin:0 0 6px}
.card{border:1px solid #ddd;border-radius:12px;padding:12px;margin:12px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button,input,select{font-size:16px;padding:8px 10px}
.choiceBtn{font-size:18px;font-weight:700;border-radius:10px}
.big{font-size:20px;font-weight:700}
.muted{opacity:.7}
#log{
  white-space:pre-wrap;background:#fafafa;border:1px solid #eee;border-radius:10px;
  padding:10px;min-height:150px;max-height:320px;overflow:auto
}
.ok{color:#0a7}
.ng{color:#c33}

#confetti-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  overflow: hidden;
  z-index: 9999;
}
.confetti {
  position: absolute;
  width: 10px;
  height: 10px;
  opacity: 0.9;
  animation: confetti-fall 4s linear forwards;
}
@keyframes confetti-fall {
  0% {
    transform: translateY(-10vh) rotate(0deg);
    opacity: 1;
  }
  100% {
    transform: translateY(110vh) rotate(720deg);
    opacity: 0;
  }
}

.annotation {
  color: #ccc; /* 注釈全体の文字色を少し薄くします */
  font-size: 12px;
  text-align: center;
  margin-top: 24px;
}
.annotation a {
  color: #fff !important; /* リンクの色を白にします */
  text-decoration: underline;
}

/* 属性エフェクト用スタイル */
.zokusei-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  pointer-events: none;
  z-index: 10000;
  transform: translateY(100vh); /* 初期位置は画面下外 */
}
.zokusei-container.slide-in {
  animation: slideInFromBottom 1s ease-out forwards;
}
.zokusei-container.slide-out {
  animation: slideOutToTop 1s ease-in forwards;
}
#zokusei-image {
  max-width: 80%;
  max-height: 80%;
}
@keyframes slideInFromBottom {
  from { transform: translateY(100vh); }
  to { transform: translateY(0); }
}
@keyframes slideOutToTop {
  from { transform: translateY(0); }
  to { transform: translateY(-100vh); }
}
</style>

<!-- PeerJS (public PeerServer Cloud) -->
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<!-- QR code -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<!-- kuromoji.js -->
<script src="https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/build/kuromoji.js"></script>
</head>

<body>
<div id="confetti-container"></div>
<h1>叫ぶ百人一首 Karuta Shout（P2P / iPhone混在）v0.17</h1>

<div class="card" id="modeCard"></div>

<div class="card">
  <div class="row">
    <div><b>状態:</b> <span id="status">-</span></div>
    <div><b>ID:</b> <code id="selfId">-</code></div>
    <div id="peerCountWrapper"><b>参加者:</b> <span id="peerCount">0</span></div>
  </div>
</div>

<!-- HOST UI -->
<div class="card" id="hostUI" style="display:none">
  <h2>親機（出題者）</h2>

  <div class="row">
    <button id="startGame" disabled>ゲーム開始</button>
    <button id="nextRound" disabled style="display:none">次の問題</button>
  </div>
  <div class="row" style="margin-top:8px;">
    <input type="checkbox" id="bgmMode" name="bgmMode">
    <label for="bgmMode">作業BGMモード（次の歌まで0秒～10分）</label>
  </div>
  <div class="row" style="margin-top:8px;">
    <input type="checkbox" id="reverseMode" name="reverseMode">
    <label for="reverseMode">音声札流しモード（下の句→上の句）</label>
  </div>
  <div class="row" style="margin-top:8px;align-items:center;">
    <label for="questionCount" style="white-space:nowrap;">問題数:</label>
    <input type="range" id="questionCount" min="1" max="100" value="100" style="flex:1">
    <span id="questionCountValue" style="width:3em;text-align:right;font-weight:bold;">100</span>
  </div>
  <div class="row" style="margin-top:6px">
    <div>問題: <span id="questionNum">-</span> / 100 (歌ID: <span id="cardIdSpan">-</span>)</div>
    <div>現在の状態: <b id="roundStatus">待機中</b></div>
  </div>
  <div style="margin-top:6px" id="questionWrap">出題(上の句): <span id="currentQuestionKimariji">-</span></div>
  <div style="margin-top:6px" id="answerWrap">正解(下の句): <span id="currentAnswer">-</span></div>


  <div style="margin-top:10px">
    <div class="big">スコアボード</div>
    <div id="scoreboard"></div>
  </div>

  <div style="margin-top:10px">
    <div class="big">参加用QR</div>
    <div id="qrcode"></div>
    <div style="margin-top:6px">
      <a id="joinLink" href="#" target="_blank" style="word-break:break-all"></a>
    </div>
  </div>

  <div style="margin-top:10px">
    <div class="big">結果</div>
    <div id="result">-</div>
  </div>
</div>

<!-- PLAYER UI -->
<div class="card" id="playerUI" style="display:none">
  <h2>子機（回答者）</h2>
  <div><b>ニックネーム:</b> <span id="myNickname">-</span></div>
  <div id="compatMsg" class="muted"></div>

  <div id="answerBlock" style="margin-top:8px">
    <div class="row">
      <input id="textInput" placeholder="回答を入力してEnter" style="flex:1" disabled>
      <button id="speak" disabled>音声で回答</button>
    </div>
    <div class="muted">PC/Androidは音声認識、iPhoneはテキスト入力が推奨です。</div>
    <div>送信: <span id="lastSent">-</span></div>
  </div>
  <button id="micPerm" style="display:none">マイク許可</button>
</div>

<div class="card">
  <h2>ログ</h2>
  <div id="log"></div>
</div>

<div id="zokusei-container" class="zokusei-container" style="display: none;">
  <img id="zokusei-image" src="" alt="属性">
</div>


<script>
(() => {
  let kamiKimarijiList = [];
  let kimarijiList = [];
  let animalNames = [];
  let isReverseMode = false;
  // ★★★ gooラボのひらがな化APIを使用するために、ご自身のAPP IDを設定してください ★★★
  const GOO_APP_ID = "YOUR_GOO_LAB_APP_ID"; 

  const $ = id => document.getElementById(id);

  const log = (s) => {
    const el = $("log");
    el.textContent += s + "\n";
    el.scrollTop = el.scrollHeight;
  };

  const params = new URLSearchParams(location.search);
  const role = (params.get("role") || "host").toLowerCase();
  const hostId = params.get("host");

  $("modeCard").innerHTML = `<b>モード:</b> ${role}`;
  log(`[init] role=${role} hostId=${hostId || "-"}`);

  function shortId(s){ return String(s||"").slice(0,8); }

  function normalizeChoice(text){
    if(!text) return null;
    let t = String(text).replace(/\s+/g,"").replace(/[、。．，]/g,"");
    t = t.replace(/[\u30a1-\u30f6]/g, (match) => {
      const chr = match.charCodeAt(0) - 0x60;
      return String.fromCharCode(chr);
    });
    const targetList = isReverseMode ? kamiKimarijiList : kimarijiList;
    const sortedKimariji = targetList.slice(1).sort((a, b) => b.length - a.length);
    return sortedKimariji.find(k => t.startsWith(k)) || null;
  }

  const peer = new Peer();
  const conns = new Map();

  // --- 親機側の状態管理 ---
  let tokenizer = null;
  let gameInProgress = false;
  let questionIds = [];
  let currentQuestionIndex = -1;
  let roundOpen = false;
  let currentCardId = null;
  let key = null;
  let winner = null;
  const playerInfo = new Map(); // { score, nickname }
  const answerQueue = [];
  let isProcessingQueue = false;
  let currentAudio = null;
  let totalQuestions = 100;
  let roundTimer = null;

  function broadcast(obj){
    conns.forEach(c => { if(c.open) c.send(obj); });
  }

  function updateScoreboard(){
    let html = "";
    playerInfo.forEach((info, peerId) => {
      html += `<div>${info.nickname} (${shortId(peerId)}): ${info.score}点</div>`;
    });
    $("scoreboard").innerHTML = html;
  }

  function convertToHiragana(text) {
    if (!tokenizer) {
      log("[host] Tokenizer not ready.");
      return text;
    }
    const tokens = tokenizer.tokenize(text);
    return tokens.map(token => token.reading ? token.reading.replace(/[\u30a1-\u30f6]/g, m => String.fromCharCode(m.charCodeAt(0) - 0x60)) : token.surface_form).join('');
  }

  async function processAnswerQueue() {
    if (isProcessingQueue || answerQueue.length === 0) return;
    if (winner) {
      answerQueue.length = 0;
      return;
    }

    isProcessingQueue = true;
    const { raw, peerId } = answerQueue.shift();

    try {
      const hiraganaText = convertToHiragana(raw);
      log(`[host] Converted "${raw}" to "${hiraganaText}"`);
      const norm = normalizeChoice(hiraganaText);
      const ok = (norm === key);

      if (ok) {
        clearTimeout(roundTimer);
        winner = peerId;
        roundOpen = false;
        const winnerInfo = playerInfo.get(peerId);
        if(winnerInfo) {
          winnerInfo.score = (winnerInfo.score || 0) + 1;
        }
        updateScoreboard();
        const winnerName = winnerInfo ? `${winnerInfo.nickname} (${shortId(winner)})` : shortId(winner);
        $("result").innerHTML = `<span class="ok">勝者:</span> ${winnerName} / 回答: ${norm}`;
        $("roundStatus").textContent = "正解！";
        log(`[host] Winner is ${winnerName}`);

        if (currentAudio) currentAudio.pause();
        
        const audioFile = isReverseMode ? `./sounds/I-${String(currentCardId).padStart(3, '0')}A.mp3` : `./sounds/I-${String(currentCardId).padStart(3, '0')}B.mp3`;
        const audioB = new Audio(audioFile);
        currentAudio = audioB;
        
        broadcast({ type: "roundResult", winner, norm, raw, correct: true, key, cardId: currentCardId });

        audioB.onended = scheduleNextRound;

        $("nextRound").disabled = true;
        audioB.play();
      } else {
        const conn = conns.get(peerId);
        if (conn && conn.open) {
          conn.send({ type: "incorrectAnswer" });
        }
        log(`[host] Incorrect answer from ${shortId(peerId)}: "${raw}"`);
      }
    } catch (error) {
      log(`[host] Error processing answer: ${error}`);
    } finally {
      isProcessingQueue = false;
      if (answerQueue.length > 0) processAnswerQueue();
    }
  }

  function scheduleNextRound() {
    const isBgmMode = $("bgmMode").checked;
    let delay = 2000;

    if (isBgmMode) {
      delay = Math.random() * 600 * 1000;
      log(`[host] BGM mode enabled. Next round in ${Math.round(delay / 1000)} seconds.`);
    } else {
      log(`[host] Next round in 2 seconds.`);
    }

    if (currentQuestionIndex >= questionIds.length - 1) {
      setTimeout(showFinalResult, delay);
      log('[host] No more questions.');
    } else {
      $("roundStatus").textContent = "次の問題へ...";
      $("nextRound").disabled = true;
      setTimeout(startNewRound, delay);
    }
  }

  function showFinalResult() {
    let finalResult = "<h2>ゲーム終了！</h2>";
    let maxScore = -1;
    let champions = [];
    playerInfo.forEach((info, pId) => {
      const playerName = `${info.nickname} (${shortId(pId)})`;
      finalResult += `<div>${playerName}: ${info.score}点</div>`;
      if (info.score > maxScore) {
        maxScore = info.score;
        champions = [pId];
      } else if (info.score === maxScore) {
        champions.push(pId);
      }
    });

    if (maxScore > 0) {
      const championNames = champions.map(pId => playerInfo.get(pId).nickname).join(', ');
      finalResult += `<div class="big" style="margin-top:10px">優勝: ${championNames}</div>`;
    } else {
      finalResult += `<div class="big" style="margin-top:10px">勝者なし</div>`;
      champions = [];
    }

    $("result").innerHTML = finalResult;
    $("roundStatus").textContent = "ゲーム終了";
    $("nextRound").style.display = "none";
    $("startGame").style.display = "inline-block";
    $("questionCount").disabled = false;
    $("reverseMode").disabled = false;
    gameInProgress = false;
    broadcast({ type: "gameOver", champions });
  }

  // --- 子機側の状態管理 ---
  function setAnswerEnabled(enabled){
    $("textInput").disabled = !enabled;
    $("speak").disabled = !enabled;
  }

  function showConfetti() {
    const container = $("confetti-container");
    if (!container) return;
    const colors = ['#ff4136', '#01ff70', '#0074d9', '#ffdc00', '#7fdbff', '#f012be'];
    for (let i = 0; i < 150; i++) {
      const confetti = document.createElement('div');
      confetti.className = 'confetti';
      confetti.style.left = Math.random() * 100 + 'vw';
      confetti.style.animationDelay = Math.random() * -2.5 + 's';
      confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      const size = Math.random() * 8 + 6;
      confetti.style.width = size + 'px';
      confetti.style.height = size + 'px';
      container.appendChild(confetti);
      setTimeout(() => confetti.remove(), 4000);
    }
  }

  function showWakaImageEffect(cardId) {
    if (!cardId) return;

    const container = $('zokusei-container');
    const image = $('zokusei-image');
    image.src = `./images/m${cardId}.jpg`;

    container.style.display = 'flex';
    container.className = 'zokusei-container slide-in';

    setTimeout(() => {
      container.className = 'zokusei-container slide-out';
      setTimeout(() => {
        container.style.display = 'none';
        container.className = 'zokusei-container';
      }, 1000);
    }, 3000); // 1秒スライドイン + 2秒表示
  }

  const loadKimariji = fetch('./小倉百人一首.csv')
    .then(r => {
      if (!r.ok) throw new Error(`CSV not found: ${r.status}`);
      return r.text();
    })
    .then(csv => {
      const lines = csv.trim().split('\n').slice(1);
      kamiKimarijiList = ["", ...lines.map(l => l.split(',')[1] || "")];
      kimarijiList = ["", ...lines.map(l => l.split(',')[2] || "")];
      log('[init] Kimariji list loaded.');
    });

  const loadAnimalNames = fetch('./animal.txt')
    .then(r => {
      if (!r.ok) throw new Error(`animal.txt not found: ${r.status}`);
      return r.text();
    })
    .then(text => {
      animalNames = text.trim().split('\n').filter(Boolean);
      log('[init] Animal name list loaded.');

      // 親機の場合、リストをシャッフルする
      if (role === "host") {
        for (let i = animalNames.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [animalNames[i], animalNames[j]] = [animalNames[j], animalNames[i]];
        }
        log('[host] Animal names shuffled.');
      }
    });

  peer.on("open", id => {
    $("selfId").textContent = id.slice(0,12);
    $("status").textContent = "接続OK";
    log(`[peer] open id=${id}`);

    if(role==="host"){
      // --- 親機の初期化 ---
      $("hostUI").style.display="block";

      const questionCountSlider = $("questionCount");
      const questionCountValue = $("questionCountValue");
      questionCountSlider.oninput = () => {
        questionCountValue.textContent = questionCountSlider.value;
      };
      const statusEl = $("roundStatus");
      statusEl.textContent = "データ準備中...";
      log("[host] Initializing data...");

      const loadTokenizer = new Promise((resolve, reject) => {
        kuromoji.builder({ dicPath: "./dict/" }).build((err, _tokenizer) => {
          if (err) return reject(err);
          tokenizer = _tokenizer;
          log("[host] Tokenizer ready.");
          resolve();
        });
      });

      Promise.all([loadKimariji, loadTokenizer, loadAnimalNames]).then(() => {
        statusEl.textContent = "待機中";
        $("startGame").disabled = false;
      }).catch(err => {
        log("[host] Initialization failed: " + err);
        statusEl.textContent = "初期化エラー";
        alert("データの初期化に失敗しました: " + err);
      });

      const url = new URL(location.href);
      url.searchParams.set("role","player");
      url.searchParams.set("host",id);
      $("joinLink").href = url.toString();
      $("joinLink").textContent = url.toString();
      $("qrcode").innerHTML = "";
      new QRCode($("qrcode"),{text:url.toString(),width:200,height:200});
      log(`[host] join url = ${url.toString()}`);

      peer.on("connection", c => {
        // イベントハンドラを先に登録する
        c.on("data", msg => {
          if (msg && msg.type === "answer") {
            if (!roundOpen) return;
            answerQueue.push({ raw: msg.raw, peerId: c.peer });
            processAnswerQueue();
          }
        });

        c.on("close", () => {
          const closedPlayer = playerInfo.get(c.peer);
          log(`[host] disconnected: peer=${c.peer} was ${closedPlayer?.nickname}`);
          conns.delete(c.peer);
          playerInfo.delete(c.peer);
          $("peerCount").textContent = conns.size;
          updateScoreboard();
        });

        // 'open' を待ってから、接続処理とメッセージ送信を行う
        c.on('open', () => {
          conns.set(c.peer, c);
          const nickname = animalNames[(conns.size - 1) % animalNames.length];
          playerInfo.set(c.peer, { score: 0, nickname: nickname });

          c.send({ type: 'nickname', name: nickname });

          $("peerCount").textContent = conns.size;
          updateScoreboard();
          log(`[host] connected: peer=${c.peer} as ${nickname}`);
        });
      });

    } else {
      // --- 子機の初期化 ---
      $("playerUI").style.display="block";
      $("peerCountWrapper").style.display = "none";
      if (!hostId) {
        alert("hostパラメータがありません。親機のQRから開いてください。");
        return;
      }

      $("status").textContent="データ読込中...";
      Promise.all([loadKimariji, loadAnimalNames]).then(() => {
          log('[player] Data loaded.');

          let recognition = null;
          let recognitionActive = false;

          const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
          if (SR) {
            recognition = new SR();
            recognition.lang = "ja-JP";
            recognition.continuous = false;
            recognition.interimResults = false;

            if (window.SpeechGrammarList || window.webkitSpeechGrammarList) {
              log('[player] Speech grammar will be set on round start.');
            } else {
              log('[player] Speech grammar not supported on this browser.');
            }

            recognition.onresult = e => {
              const result = e.results?.[e.results.length - 1];
              if (!result) return;

              let sent = false;
              for (const alt of result) {
                const normalized = normalizeChoice(alt.transcript);
                if (normalized) {
                  log(`[player] STT matched: "${alt.transcript}" (confidence: ${alt.confidence}) -> normalized: "${normalized}"`);
                  send(alt.transcript);
                  sent = true;
                  break;
                }
              }

              if (!sent && result[0]) {
                  const raw = result[0].transcript;
                  log(`[player] STT result raw (no match): "${raw}"`);
                  send(raw);
              }
            };
            recognition.onerror = e => {
              log(`[player] STT error: ${e.error || "unknown"}`);
            };
            recognition.onend = () => {
              log("[player] STT end");
              if (recognitionActive) {
                log("[player] STT restarting...");
                try { recognition.start(); } catch(e) { /* 既に開始されている場合のエラーは無視 */ }
              }
            };
            
            $("micPerm").style.display = "inline-block";
            $("speak").onclick = () => {
              if (recognition && !recognitionActive) {
                recognitionActive = true;
                try { recognition.start(); } catch(e) { log('[player] recognition.start failed: ' + e); }
              }
            };
            $("micPerm").onclick = async () => {
              try {
                await navigator.mediaDevices.getUserMedia({audio:true});
                log("[player] mic permission OK");
                $("micPerm").style.display = "none";
              } catch (e) {
                alert("マイク許可が必要です: " + e);
              }
            };
          } else {
            $("speak").style.display = "none";
          }

          $("status").textContent="親機へ接続中...";
          const c = peer.connect(hostId);

          c.on("open",()=> {
            $("status").textContent="親機接続OK";
            log(`[player] connected to host=${hostId}`);
          });
          c.on("close",()=> {
            $("status").textContent="切断";
            setAnswerEnabled(false);
            recognitionActive = false;
            if (recognition) recognition.stop();
          });
          c.on("data", msg=>{
            log(`[player] recv ${JSON.stringify(msg)}`);
            if (msg && msg.type === 'nickname') {
              $("myNickname").textContent = msg.name;
              log(`[player] My nickname is ${msg.name}`);
            }
            if (msg && msg.type === "gameStart") {
              isReverseMode = msg.reverse;
              log(`[player] Game starting. 音声札流しモード=${isReverseMode}`);
            }
            if(msg && msg.type==="round"){
              setAnswerEnabled(true);
              $("textInput").focus();
              if (recognition) {
                if (window.SpeechGrammarList || window.webkitSpeechGrammarList) {
                    const targetList = isReverseMode ? kamiKimarijiList : kimarijiList;
                    const grammar = '#JSGF V1.0; grammar choices; public <choice> = ' + targetList.slice(1).filter(Boolean).join(' | ') + ' ;';
                    const speechRecognitionList = new (window.SpeechGrammarList || window.webkitSpeechGrammarList)();
                    speechRecognitionList.addFromString(grammar, 1);
                    recognition.grammars = speechRecognitionList;
                    log(`[player] Speech grammar set for ${isReverseMode ? 'reverse' : 'normal'} mode.`);
                }
                recognitionActive = true;
                try { recognition.start(); } catch(e) { log('[player] recognition.start failed: ' + e); }
              }
            }
            if(msg && msg.type==="roundResult"){
              setAnswerEnabled(false);
              recognitionActive = false;
              if (recognition) recognition.stop();
              $("textInput").value = "";

              if (msg.winner === id) {
                log('[player] I am the winner!');
                new Audio('./se/Quiz-Ding_Dong02-2(Fast-Single).mp3').play();
                showConfetti();
                showWakaImageEffect(msg.cardId);
              }
            }
            if (msg && msg.type === "incorrectAnswer") {
              new Audio('./se/Quiz-Buzzer05-2(Short).mp3').play();
              $("textInput").value = "";
            }
            if (msg && msg.type === "gameOver") {
              if (msg.champions && msg.champions.includes(id)) {
                log('[player] I am the champion!');
                new Audio('./se/Quiz-Ding_Dong02-2(Fast-Single).mp3').play();
                showConfetti();
              }
            }
          });

          function send(raw){
            if(!c || !c.open) return;
            c.send({type:"answer", raw});
            $("lastSent").textContent = raw;
            $("textInput").value = "";
          }

          $("textInput").onkeydown = (e) => {
            if (e.key === "Enter") {
              e.preventDefault();
              send(e.target.value);
            }
          };
          
          setAnswerEnabled(false);
        })
        .catch(err => {
          log("[player] Initialization failed: " + err);
          $("status").textContent = "初期化エラー";
          alert("データの初期化に失敗しました: " + err);
        });
    }
  });

  peer.on("error", (err) => {
    $("status").textContent = "エラー";
    log("[peer] error: " + (err?.type || "") + " " + (err?.message || String(err)));
  });

  // --- 親機のボタン処理 ---
  $("startGame").onclick=()=>{
    if (role !== "host" || gameInProgress) return;
    gameInProgress = true;
    totalQuestions = parseInt($("questionCount").value, 10);
    isReverseMode = $("reverseMode").checked;
    $("questionCount").disabled = true;
    $("reverseMode").disabled = true;

    let allIds = Array.from({length: 100}, (_, i) => i + 1);
    for (let i = allIds.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [allIds[i], allIds[j]] = [allIds[j], allIds[i]];
    }
    questionIds = allIds.slice(0, totalQuestions);
    log(`[host] Game started with ${totalQuestions} questions. 音声札流しモード: ${isReverseMode}`);
    currentQuestionIndex = -1;
    playerInfo.forEach((info, key) => info.score = 0);
    updateScoreboard();

    broadcast({ type: 'gameStart', reverse: isReverseMode });

    $("startGame").style.display = "none";
    $("nextRound").style.display = "inline-block";
    $("nextRound").disabled = false;
    
    startNewRound();
  };

  function startNewRound(){
    if (role !== "host") return;
    currentQuestionIndex++;
    currentCardId = questionIds[currentQuestionIndex];
    
    const kami = kamiKimarijiList[currentCardId];
    const shimo = kimarijiList[currentCardId];

    key = isReverseMode ? kami : shimo;
    const questionText = isReverseMode ? shimo : kami;
    const answerText = isReverseMode ? kami : shimo;
    
    const questionLabel = isReverseMode ? '出題(下の句)' : '出題(上の句)';
    const answerLabel = isReverseMode ? '正解(上の句)' : '正解(下の句)';
    $("questionWrap").innerHTML = `${questionLabel}: <span id="currentQuestionKimariji">-</span>`;
    $("answerWrap").innerHTML = `${answerLabel}: <span id="currentAnswer">-</span>`;

    $("questionNum").textContent = `${currentQuestionIndex + 1} / ${totalQuestions}`;
    $("cardIdSpan").textContent = currentCardId;
    $("currentQuestionKimariji").textContent = questionText;
    $("currentAnswer").textContent = answerText;
    $("result").textContent="-";
    $("nextRound").disabled = true;
    $("roundStatus").textContent = "出題準備中...";
    winner = null;
    answerQueue.length = 0;
    if (roundTimer) clearTimeout(roundTimer);

    log(`[host] ROUND ${currentQuestionIndex + 1} START (ID: ${currentCardId}, Key: ${key})`);

    setTimeout(() => {
      roundOpen = true;
      if (currentAudio) {
        currentAudio.pause();
      }
      
      const audioFile = isReverseMode ? `./sounds/I-${String(currentCardId).padStart(3,'0')}B.mp3` : `./sounds/I-${String(currentCardId).padStart(3,'0')}A.mp3`;
      const audioA = new Audio(audioFile);
      currentAudio = audioA;

      audioA.onended = () => {
        log('[host] audioA ended. Starting 10s timeout.');
        roundTimer = setTimeout(() => {
          if (winner) return;

          log('[host] Round timed out.');
          roundOpen = false;
          if (currentAudio) currentAudio.pause();
          
          $("roundStatus").textContent = "時間切れ";
          $("result").textContent = "正解者なし";
          broadcast({ type: "roundResult", winner: null });

          new Audio('./se/決定ボタンを押す2.mp3').play();

          const audioFileB = isReverseMode ? `./sounds/I-${String(currentCardId).padStart(3, '0')}A.mp3` : `./sounds/I-${String(currentCardId).padStart(3, '0')}B.mp3`;
          const audioB = new Audio(audioFileB);
          currentAudio = audioB;
          audioB.onended = scheduleNextRound;
          audioB.play();
        }, 10000);
      };

      audioA.play();
      broadcast({type:"round"});
      $("roundStatus").textContent = "回答受付中";
      log("[host] audio played, round opened");
      $("nextRound").disabled = false;
    }, 2000);
  }

  $("nextRound").onclick = () => {
    if (role !== "host" || !gameInProgress) return;

    if (currentAudio) {
      currentAudio.pause();
      currentAudio = null;
    }
    if (roundTimer) clearTimeout(roundTimer);
    if (roundOpen) {
      roundOpen = false;
      broadcast({type:"roundResult"});
      log(`[host] Skipping question ${currentCardId}`);
    }
    
    scheduleNextRound();
  };
})();
</script>
